<!DOCTYPE html>
<html lang="en-us">

  {% include head.html %}

  <body>

    {% include topbar.html %}

    <main class="page page--anime">
      <section class="anime-page">
        <header class="anime-header">
          <h1>Anime Tiers</h1>
          <p class="anime-lede">Aggregate tier list. Pick Average or one person.</p>
        </header>

        <div class="anime-toolbar">
          <div class="anime-categories" id="anime-toggles" role="radiogroup" aria-label="Rating view"></div>
          <label class="anime-search" for="anime-search">
            <span class="anime-sr">Filter shows</span>
            <svg class="anime-search-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M7 1.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11Zm0 1.25a4.25 4.25 0 1 0 0 8.5 4.25 4.25 0 0 0 0-8.5Z" fill="currentColor"/>
              <path d="M11.03 10.22a.75.75 0 0 1 1.06 1.06l2.47 2.47a.75.75 0 1 1-1.06 1.06l-2.47-2.47a.75.75 0 0 1 0-1.06Z" fill="currentColor"/>
            </svg>
            <input type="search" id="anime-search" placeholder="Filter shows" autocomplete="off" enterkeyhint="search">
          </label>
        </div>

        <div id="anime-status" class="anime-status"></div>

        <div id="anime-editor" class="anime-editor" hidden>
          <form id="anime-add-form" class="anime-add-form">
            <div class="anime-field">
              <label class="anime-field-label" for="anime-title">Title</label>
              <input type="text" id="anime-title" placeholder="Show title" required autocomplete="off">
            </div>
            <div class="anime-add-form-actions">
              <div class="anime-field">
                <label class="anime-field-label" for="anime-tier">Your tier</label>
                <select id="anime-tier">
                  <option value="">Unrated</option>
                  <option value="1">Tier 1 — Masterpiece</option>
                  <option value="2">Tier 2 — Awesome</option>
                  <option value="3">Tier 3 — Suggestable</option>
                  <option value="4">Tier 4 — Ok</option>
                  <option value="5">Tier 5 — Waste of Time</option>
                </select>
              </div>
              <div class="anime-field anime-field-action">
                <button type="submit" class="anime-btn is-solid" id="anime-add-btn" disabled>Add anime</button>
              </div>
            </div>
            <div class="anime-pick" id="anime-pick" hidden>
              <p class="anime-pick-label">Multiple matches. Pick one:</p>
              <div class="anime-pick-list" id="anime-pick-list" role="listbox" aria-label="IMDb matches"></div>
              <button type="button" class="anime-btn" id="anime-pick-cancel">Cancel</button>
            </div>
          </form>
        </div>

        <div class="anime-board" id="anime-board"></div>

        <footer class="anime-auth-panel" id="anime-auth-panel">
          <div class="anime-auth" id="anime-auth"></div>
        </footer>
      </section>

      <link rel="stylesheet" href="/public/css/anime.css?v={{ site.time | date: '%s' }}">
      <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
      <script src="/public/js/anime-config.js?v={{ site.time | date: '%s' }}"></script>
      <script src="/public/js/anime.js?v={{ site.time | date: '%s' }}"></script>
    </main>

    {% include footer.html %}

  </body>
</html>
