<section class="anime-page">
  <header class="anime-header">
    <h1>Anime Tiers</h1>
    <p class="anime-lede">Aggregate tier list. Toggle people on or off to recalculate.</p>
  </header>

  <div class="anime-toolbar">
    <div class="anime-categories" id="anime-toggles" role="group" aria-label="Included ratings"></div>
  </div>

  <div id="anime-status" class="anime-status"></div>

  <div id="anime-editor" class="anime-editor" hidden>
    <form id="anime-add-form" class="anime-add-form">
      <div class="anime-field">
        <label class="anime-field-label" for="anime-title">Title</label>
        <input type="text" id="anime-title" placeholder="Show title" required>
      </div>
      <div class="anime-field">
        <label class="anime-field-label" for="anime-url">IMDb URL</label>
        <input type="url" id="anime-url" placeholder="https://www.imdb.com/title/tt0880778/" required>
      </div>
      <div class="anime-add-form-actions">
        <div class="anime-field">
          <label class="anime-field-label" for="anime-tier">Your tier</label>
          <select id="anime-tier">
            <option value="">Pick tier</option>
            <option value="1">Tier 1 — Masterpiece</option>
            <option value="2">Tier 2 — Awesome</option>
            <option value="3">Tier 3 — Suggestable</option>
            <option value="4">Tier 4 — Ok</option>
            <option value="5">Tier 5 — Waste of Time</option>
          </select>
        </div>
        <div class="anime-field anime-field-action">
          <button type="submit" class="anime-btn is-solid" id="anime-add-btn" disabled>Add anime</button>
        </div>
      </div>
    </form>
  </div>

  <div class="anime-board" id="anime-board"></div>

  <footer class="anime-auth-panel" id="anime-auth-panel">
    <div class="anime-auth" id="anime-auth"></div>
  </footer>
</section>

<link rel="stylesheet" href="/public/css/anime.css?v={{ site.time | date: '%s' }}">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/public/js/anime-config.js?v={{ site.time | date: '%s' }}"></script>
<script src="/public/js/anime.js?v={{ site.time | date: '%s' }}"></script>
